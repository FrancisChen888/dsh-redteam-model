# dsh-semgrep-audit：本机 semgrep 封装（预设离线三层规则集自动定位、证据落盘、
# 命中对账双写 scan-reconcile.md/.csv、metrics 关闭；仅用检测到的本机 semgrep，
# 缺装走三级兜底提示，绝不自动安装）。
#
# 宿主平面：随集合 bundle 全模式常驻，不再由 code-audit 预设持行。本文件是该插件被
# 单独装进 profile 时用的 bundle 补丁；集合的 cordis.patch.yml 另有一条
# bundled-dsh-semgrep-audit include 行读 ./bundled.cordis.yml，且在该包已列入
# dsh.profile.bundles 时自动停用 —— 两条路径互斥，永远只挂一次。
#
# 本文件必须保持合法的顶层 YAML 数组：仅含注释时解析为 null，
# 会导致 dsh 启动器报 "must be a top-level YAML array" 而整个 profile 无法启动。
- insert:
    - id: tool-semgrep
      name: '@dsh-external/dsh-semgrep-audit'
