# dsh-scanner-tools：本机 nuclei / httpx / ffuf 等扫描器封装（保守速率默认、超速审计、
# 证据落盘、nuclei 命中→scan-reconcile 待处置、主动扫描的 assets.md 防盲打内置；
# 仅调用检测到的本机二进制，缺装走三级兜底提示，绝不自动安装）。
#
# 宿主平面：随集合 bundle 全模式常驻，不再由模式预设持行。本文件是该插件被单独装进
# profile 时用的 bundle 补丁；集合的 cordis.patch.yml 另有一条 bundled-dsh-scanner-tools
# include 行读 ./bundled.cordis.yml，且在该包已列入 dsh.profile.bundles 时自动停用 ——
# 两条路径互斥，永远只挂一次。
#
# 本文件必须保持合法的顶层 YAML 数组：仅含注释时解析为 null，
# 会导致 dsh 启动器报 "must be a top-level YAML array" 而整个 profile 无法启动。
- insert:
    - id: tool-scanner
      name: '@dsh-external/dsh-scanner-tools'
